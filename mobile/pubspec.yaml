name: ismn_mobile
description: ISMN — локальная панель мониторинга и управления сетью
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.4"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: 1.0.8
  flutter_riverpod: 2.6.1
  go_router: 15.1.2
  dio: 5.8.0+1
  web_socket_channel: 3.0.3
  flutter_secure_storage: 9.2.4
  shared_preferences: 2.5.3
  fl_chart: 1.0.0
  intl: ^0.20.3
  path_provider: 2.1.5
  share_plus: 10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/ismn_logo.png

